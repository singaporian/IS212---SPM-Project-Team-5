name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install end-to-end test dependencies
        run: npm --prefix e2e ci

      - name: Run backend lint
        run: npm --prefix backend run lint

      - name: Run frontend lint
        run: npm --prefix frontend run lint

      - name: Run end-to-end lint
        run: npm --prefix e2e run lint

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connectsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d connectsphere"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: connectsphere
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-test-secret
      PORT: 3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Initialize PostgreSQL schema
        run: npm --prefix backend run init-db

      - name: Run backend tests
        run: npm --prefix backend test

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend tests
        run: npm --prefix frontend test

  audit:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Audit backend production dependencies
        run: npm audit --prefix backend --package-lock-only --omit=dev --audit-level=high

      - name: Audit frontend production dependencies
        run: npm audit --prefix frontend --package-lock-only --omit=dev --audit-level=high

      - name: Audit end-to-end production dependencies
        run: npm audit --prefix e2e --package-lock-only --omit=dev --audit-level=high
